<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示词扩写工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 0.9rem;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .panel:hover {
            border-color: rgba(0, 217, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.1);
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .panel-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00d9ff 0%, #00ff88 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .panel-subtitle {
            font-size: 0.75rem;
            color: #666;
        }

        .textarea-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            padding-bottom: 50px;
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: rgba(0, 217, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.15);
        }

        textarea::placeholder {
            color: #555;
        }

        .expand-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d9ff 0%, #00ff88 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #1a1a2e;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
        }

        .expand-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 217, 255, 0.5);
        }

        .expand-btn:active {
            transform: scale(0.95);
        }

        .expand-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .expand-btn.loading {
            pointer-events: none;
        }

        .expand-btn.loading::after {
            content: '';
            width: 18px;
            height: 18px;
            border: 2px solid #1a1a2e;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .expand-btn.loading span {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .config-section {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
        }

        .config-title {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .config-grid {
                grid-template-columns: 1fr;
            }
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-item label {
            font-size: 0.75rem;
            color: #666;
        }

        .config-item input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #e0e0e0;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .config-item input:focus {
            outline: none;
            border-color: rgba(0, 217, 255, 0.5);
        }

        .config-item input::placeholder {
            color: #444;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 14px 24px;
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            border-color: rgba(255, 100, 100, 0.5);
        }

        .toast.success {
            border-color: rgba(0, 255, 136, 0.5);
        }

        .tips {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.15);
            border-radius: 12px;
            font-size: 0.8rem;
            color: #888;
            line-height: 1.8;
        }

        .tips strong {
            color: #00d9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>提示词扩写工具</h1>
        <p class="subtitle">点击右下角的"扩"按钮，使用 AI 扩写文本内容</p>

        <div class="panels">
            <!-- 系统提示词面板 -->
            <div class="panel" id="systemPanel">
                <div class="panel-header">
                    <div class="panel-icon">⚙️</div>
                    <div>
                        <div class="panel-title">系统提示词</div>
                        <div class="panel-subtitle">设置 AI 角色和行为</div>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea 
                        id="systemPrompt" 
                        placeholder="在此输入系统提示词..."
                    ></textarea>
                    <button class="expand-btn" onclick="expandText('system')" title="扩写">
                        <span>扩</span>
                    </button>
                </div>
            </div>

            <!-- 用户指令提示词面板 -->
            <div class="panel" id="userPanel">
                <div class="panel-header">
                    <div class="panel-icon">💬</div>
                    <div>
                        <div class="panel-title">用户指令</div>
                        <div class="panel-subtitle">描述图片分析要求</div>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea 
                        id="userPrompt" 
                        placeholder="在此输入用户指令..."
                    ></textarea>
                    <button class="expand-btn" onclick="expandText('user')" title="扩写">
                        <span>扩</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="config-section">
            <div class="config-title">
                <span>⚡</span> API 配置
            </div>
            <div class="config-grid">
                <div class="config-item">
                    <label>API 地址</label>
                    <input 
                        type="text" 
                        id="apiUrl" 
                        placeholder="http://64.186.244.43:12001"
                    />
                </div>
                <div class="config-item">
                    <label>API Key</label>
                    <input 
                        type="password" 
                        id="apiKey" 
                        placeholder="留空则不认证"
                    />
                </div>
                <div class="config-item">
                    <label>模型名称</label>
                    <input 
                        type="text" 
                        id="modelName" 
                        placeholder="Qwen/Qwen2.5-VL-7B-Instruct"
                    />
                </div>
                <div class="config-item">
                    <label>最大 Tokens</label>
                    <input 
                        type="number" 
                        id="maxTokens" 
                        value="1024"
                        min="64"
                        max="8192"
                    />
                </div>
            </div>
        </div>

        <div class="tips">
            <strong>使用说明：</strong><br>
            1. 在上方两个文本框中分别输入系统提示词和用户指令<br>
            2. 点击每个文本框右下角的"扩"按钮，AI 将自动扩写该文本框的内容<br>
            3. 两个文本框完全独立，互不影响<br>
            4. 扩写提示词：<em>保持文本大致信息不变，扩写文本，使文本表述的内容更加详细</em>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const EXPAND_PROMPT = "保持文本大致信息不变，扩写文本，使文本表述的内容更加详细";

        let isExpanding = {
            system: false,
            user: false
        };

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function expandText(type) {
            if (isExpanding[type]) return;

            const textareaId = type === 'system' ? 'systemPrompt' : 'userPrompt';
            const textarea = document.getElementById(textareaId);
            const originalText = textarea.value.trim();

            if (!originalText) {
                showToast('请先输入要扩写的文本', 'error');
                return;
            }

            const apiUrl = document.getElementById('apiUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelName = document.getElementById('modelName').value.trim() || 'Qwen/Qwen2.5-VL-7B-Instruct';
            const maxTokens = parseInt(document.getElementById('maxTokens').value) || 1024;

            if (!apiUrl) {
                showToast('请填写 API 地址', 'error');
                return;
            }

            isExpanding[type] = true;
            const btn = textarea.parentElement.querySelector('.expand-btn');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const baseUrl = normalizeApiBase(apiUrl);
                const chatUrl = `${baseUrl}/chat/completions`;

                const headers = {
                    'Content-Type': 'application/json'
                };

                if (apiKey) {
                    headers['Authorization'] = `Bearer ${apiKey}`;
                }

                const systemPromptForExpansion = type === 'system' 
                    ? EXPAND_PROMPT 
                    : `你是一个专业的提示词优化助手。请根据用户提供的系统提示词，按照以下要求进行扩写：\n${EXPAND_PROMPT}`;

                const userContentForExpansion = type === 'system'
                    ? `请扩写以下系统提示词：\n\n${originalText}`
                    : `请扩写以下用户指令：\n\n${originalText}`;

                const requestBody = {
                    model: modelName,
                    messages: [
                        {
                            role: 'system',
                            content: systemPromptForExpansion
                        },
                        {
                            role: 'user',
                            content: userContentForExpansion
                        }
                    ],
                    max_tokens: maxTokens,
                    temperature: 0.7
                };

                const response = await fetch(chatUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                const expandedText = extractContentFromResponse(data);

                if (expandedText) {
                    textarea.value = expandedText;
                    showToast('扩写成功！', 'success');
                } else {
                    throw new Error('无法从响应中提取结果');
                }

            } catch (error) {
                console.error('扩写失败:', error);
                showToast('扩写失败: ' + error.message, 'error');
            } finally {
                isExpanding[type] = false;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function normalizeApiBase(url) {
            url = url.trim().replace(/\/$/, '');
            
            if (!url.startsWith('http')) {
                url = 'http://' + url;
            }

            const lower = url.toLowerCase();
            
            if (lower.endsWith('/v1/chat/completions')) {
                return url.replace(/\/chat\/completions$/i, '').replace(/\/v1$/i, '');
            }
            
            if (lower.endsWith('/v1')) {
                return url;
            }
            
            if (!lower.includes('/v1')) {
                return url + '/v1';
            }
            
            return url;
        }

        function extractContentFromResponse(data) {
            if (!data || typeof data !== 'object') return null;

            try {
                const choices = data.choices;
                if (choices && choices.length > 0) {
                    const choice = choices[0];
                    if (choice.message && choice.message.content) {
                        return choice.message.content.trim();
                    }
                }
            } catch (e) {
                console.error('提取内容失败:', e);
            }

            const fields = ['prompt', 'result', 'text', 'description'];
            for (const field of fields) {
                if (data[field] && typeof data[field] === 'string') {
                    return data[field].trim();
                }
            }

            return null;
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('systemPrompt').value = '';
            document.getElementById('userPrompt').value = '';
            document.getElementById('apiUrl').value = 'http://64.186.244.43:12001';
            document.getElementById('modelName').value = 'Qwen/Qwen2.5-VL-7B-Instruct';
            document.getElementById('maxTokens').value = '1024';
        });
    </script>
</body>
</html>
